      - name: Install
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1769FF' --iconBackgroundColorDark '#1769FF'
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify and rename
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk saydality-shoaib.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/aapt dump badging saydality-shoaib.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: saydality-shoaib-apk
          path: saydality-shoaib.apk
